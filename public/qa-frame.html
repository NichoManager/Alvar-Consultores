<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA frame</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow: hidden;
        background: #d8d8d8;
      }

      iframe {
        display: block;
        height: 100vh;
        border: 0;
        background: #f8f6f0;
      }

      output {
        position: fixed;
        top: 0;
        right: 0;
        max-width: 120px;
        padding: 8px;
        font: 11px/1.4 monospace;
        color: #111832;
      }
    </style>
  </head>
  <body>
    <iframe id="qa-app" title="Vista temporal de QA"></iframe>
    <output id="qa-status"></output>
    <script>
      const params = new URLSearchParams(window.location.search);
      const frame = document.getElementById('qa-app');
      frame.style.width = `${params.get('width') || 375}px`;
      frame.src = params.get('path') || '/';
      frame.addEventListener('load', () => {
        window.setTimeout(() => {
          const document = frame.contentDocument;
          const action = params.get('action');
          if (action?.startsWith('menu')) document.querySelector('.menu-button')?.click();
          if (action?.startsWith('modal-')) {
            const index = Number(action.split('-')[1]);
            document.querySelectorAll('.additional-service-card__cta')[index]?.click();
          }
          window.setTimeout(() => {
            if (action === 'menu-escape') {
              document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
            }
            if (action === 'modal-0-escape') {
              document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
            }
            if (action === 'modal-0-overlay') {
              document.querySelector('.service-modal')?.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
            }
            if (action === 'modal-0-submit') {
              const form = document.querySelector('.service-request-form');
              form?.requestSubmit();
            }
            if (action === 'modal-0-success') {
              const form = document.querySelector('.service-request-form');
              form?.querySelectorAll('input[required]').forEach((input) => {
                if (input.type === 'checkbox') input.checked = true;
                else input.value = input.type === 'email' ? 'qa@example.com' : 'QA';
              });
              form?.querySelectorAll('select[required]').forEach((select) => { select.selectedIndex = 1; });
              form?.requestSubmit();
            }
            if (action === 'rent-bottom') {
              document.documentElement.style.scrollBehavior = 'auto';
              document.querySelector('.rental-owner-cta')?.scrollIntoView({ behavior: 'auto', block: 'start' });
              window.setTimeout(() => document.querySelector('.rental-owner-cta')?.scrollIntoView({ behavior: 'auto', block: 'start' }), 800);
            }
            if (action?.startsWith('scroll-')) {
              const id = action.replace('scroll-', '');
              document.documentElement.style.scrollBehavior = 'auto';
              document.getElementById(id)?.scrollIntoView({ behavior: 'auto', block: 'start' });
              window.setTimeout(() => document.getElementById(id)?.scrollIntoView({ behavior: 'auto', block: 'start' }), 800);
            }
            if (action === 'filter-city') {
              const city = document.querySelector('.property-filters select[name="city"]');
              city.value = 'Pinto';
              city.dispatchEvent(new Event('change', { bubbles: true }));
            }
            window.setTimeout(() => {
            const menuOpen = Boolean(document.querySelector('#mobile-navigation'));
            const modalOpen = Boolean(document.querySelector('[role="dialog"].service-modal__panel'));
            const success = Boolean(document.querySelector('.service-request-form__success'));
            const errors = document.querySelectorAll('.form-field__error').length;
            const overflow = document.documentElement.scrollWidth > document.documentElement.clientWidth;
            const active = document.activeElement?.getAttribute('aria-label') || document.activeElement?.className || document.activeElement?.tagName;
            const targetTop = document.getElementById('valoracion')?.getBoundingClientRect().top;
            const cards = document.querySelectorAll('.catalogue .property-card').length;
            const activeLinks = [...document.querySelectorAll('.desktop-nav a.active, .mobile-nav a.active')].map((link) => link.textContent.trim()).join('|');
            window.document.getElementById('qa-status').textContent = `menu:${menuOpen} modal:${modalOpen} success:${success} errors:${errors} overflow:${overflow} scroll:${Math.round(frame.contentWindow.scrollY)} target:${targetTop == null ? '-' : Math.round(targetTop)} cards:${cards} active:${activeLinks || '-'} search:${frame.contentWindow.location.search || '-'} focus:${active}`;
            }, 1200);
          }, 250);
        }, 100);
      });
    </script>
  </body>
</html>
