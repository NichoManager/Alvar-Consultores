<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#111832"
    />

    <title>
      Inmobiliaria en Madrid | Alvar Consultores Inmobiliarios
    </title>

    <meta
      name="description"
      content="Inmobiliaria en Madrid para comprar, vender y alquilar viviendas. Asesoramiento profesional y más de 18 años de experiencia en Madrid y alrededores."
    />

    <!--
      Metadata base de la aplicación.

      SeoHead sustituye estos valores de forma dinámica
      en cada ruta una vez cargada la aplicación.
    -->

    <!-- Open Graph / WhatsApp / Facebook / LinkedIn -->
    <meta
      property="og:title"
      content="Inmobiliaria en Madrid | Alvar Consultores Inmobiliarios"
    />

    <meta
      property="og:description"
      content="Compra, vende o alquila tu inmueble con asesoramiento inmobiliario profesional en Madrid y alrededores."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="%VITE_SITE_URL%/"
    />

    <meta
      property="og:image"
      content="%VITE_SITE_URL%/images/alvar/og-alvar-consultores.png"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:width"
      content="1731"
    />

    <meta
      property="og:image:height"
      content="909"
    />

    <meta
      property="og:image:alt"
      content="Alvar Consultores Inmobiliarios"
    />

    <meta
      property="og:site_name"
      content="Alvar Consultores Inmobiliarios"
    />

    <meta
      property="og:locale"
      content="es_ES"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Inmobiliaria en Madrid | Alvar Consultores Inmobiliarios"
    />

    <meta
      name="twitter:description"
      content="Compra, vende o alquila tu inmueble con asesoramiento inmobiliario profesional en Madrid y alrededores."
    />

    <meta
      name="twitter:image"
      content="%VITE_SITE_URL%/images/alvar/og-alvar-consultores.png"
    />

    <meta
      name="twitter:image:alt"
      content="Alvar Consultores Inmobiliarios"
    />

    <!-- Favicons -->
    <link
      rel="icon"
      href="/favicon.svg"
      type="image/svg+xml"
    />

    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
